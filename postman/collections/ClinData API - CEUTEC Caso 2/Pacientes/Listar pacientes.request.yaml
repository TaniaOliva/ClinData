$kind: http-request
url: "{{baseUrl}}/api/pacientes"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', function () {
          pm.response.to.have.status(200);
      });

      pm.test('La respuesta es un arreglo', function () {
          pm.expect(pm.response.json()).to.be.an('array');
      });
    language: text/javascript
order: 4000
