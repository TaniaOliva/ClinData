$kind: http-request
url: "{{baseUrl}}/api/pacientes"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "nombres": "",
      "apellidos": "",
      "sexo": "M",
      "identidad": "123",
      "fechaNacimiento": "1995-03-22",
      "telefono": "88776655"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 400', function () {
          pm.response.to.have.status(400);
      });

      const json = pm.response.json();

      pm.test('Devuelve al menos un error de validacion', function () {
          pm.expect(json.errores).to.be.an('array').that.is.not.empty;
      });
    language: text/javascript
order: 3000
